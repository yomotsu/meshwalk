<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>=^.^=</title>
<style>
body{margin: 0;padding: 0; background: #000;}
canvas{display: block;}
.info{
	color: #fff;
	position: absolute;
	top: 0;
	left: 0;
}
</style>
</head>
<body>
<div class="info">
	W,A,S,D key to move
</div>

<script async src="https://unpkg.com/es-module-shims@2.8.4/dist/es-module-shims.js"></script>
<script type="importmap">
	{
		"imports": {
			"three": "https://unpkg.com/three@0.185.1/build/three.module.js",
			"three/addons/": "https://unpkg.com/three@0.185.1/examples/jsm/",
			"three/examples/": "https://unpkg.com/three@0.185.1/examples/",
			"@recast-navigation/core": "https://unpkg.com/@recast-navigation/core@0.43.1/dist/index.mjs",
			"@recast-navigation/generators": "https://unpkg.com/@recast-navigation/generators@0.43.1/dist/index.mjs",
			"@recast-navigation/three": "https://unpkg.com/@recast-navigation/three@0.43.1/dist/index.mjs",
			"@recast-navigation/wasm": "https://unpkg.com/@recast-navigation/wasm@0.43.1/dist/recast-navigation.wasm-compat.js"
		}
	}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { init, Crowd } from '@recast-navigation/core';
import { threeToSoloNavMesh, NavMeshHelper, CrowdHelper } from '@recast-navigation/three';
import * as MW from '../dist/meshwalk.module.js';

await init();

const world = new MW.World();
const staticBody = new MW.StaticBody();
world.add( staticBody );


const width = window.innerWidth;
const height = window.innerHeight;
const timer = new THREE.Timer();
timer.connect( document );
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera( 40, width / height, 1, 1000 );
camera.position.set( 0, 0, 8 );
const renderer = new THREE.WebGLRenderer();
renderer.setSize( width, height );
document.body.appendChild( renderer.domElement );

scene.add( new THREE.AmbientLight( 0xffffff ) );

const playerObjectHolder = new THREE.Object3D();
scene.add( playerObjectHolder );

const playerRadius = .5;
const playerHeight = 2;
// const capsule = new THREE.Mesh(
// 	new THREE.CapsuleGeometry( playerRadius, playerHeight - playerRadius * 2, 4, 16 ),
// 	new THREE.MeshBasicMaterial( { color: 0xff0000,  wireframe: true} )
// );
// capsule.position.y = playerHeight / 2;
// playerObjectHolder.add( capsule );

const playerController = new MW.CharacterController( { radius: playerRadius, height: playerHeight } );
playerController.teleport( new THREE.Vector3( 0, 10, 0 ) );
world.add( playerController );

const tpsCameraControls = new MW.ThirdPersonCameraControls(
	camera, // three.js camera
	playerObjectHolder, // tracking object
	world,
	renderer.domElement
);

// bind events
const keyInputControl = new MW.KeyboardControls();
// キー入力 + カメラの向きから、望む水平移動速度ベクトルを作って move() に渡す
const _moveDir = new THREE.Vector3();
const _yAxis = new THREE.Vector3( 0, 1, 0 );
const applyMove = () => {

	const input = keyInputControl.inputVector;
	playerController.move( _moveDir.set( input.x, 0, - input.y ).applyAxisAngle( _yAxis, tpsCameraControls.frontAngle ).multiplyScalar( 10 ) );

};

keyInputControl.addEventListener( 'movekeyon',     applyMove );
keyInputControl.addEventListener( 'movekeychange', applyMove );
keyInputControl.addEventListener( 'movekeyoff',    () => playerController.move( _moveDir.set( 0, 0, 0 ) ) );
keyInputControl.addEventListener( 'jumpkeypress',  () => playerController.jump() );

// 移動中はカメラの向きに追従させる（'update' は tpsCameraControls.update() が発火）
tpsCameraControls.addEventListener( 'update', () => {

	if ( playerController.isRunning ) applyMove();

} );


const [ terrainGltf, navGltf, characterGltf ] = await Promise.all( [
	new GLTFLoader().loadAsync( './terrain.glb' ),
	new GLTFLoader().loadAsync( './nav.glb' ),
	new GLTFLoader().loadAsync( './miku.glb' ),
] );


const box = new THREE.Mesh(
	new THREE.BoxGeometry( 14, 1, 5 ),
	new THREE.MeshNormalMaterial()
);
box.position.set( - 3, 7.5, - 13 );
scene.add( box );
staticBody.addFromObject( box );

const terrain = terrainGltf.scene.children[ 0 ];
terrain.material = new THREE.MeshNormalMaterial();
scene.add( terrain );
staticBody.addFromObject( terrain );

playerObjectHolder.add( characterGltf.scene );

const animationController = new MW.AnimationController( characterGltf.scene, characterGltf.animations );
animationController.actions.jump.setLoop( THREE.LoopOnce, 0 );
animationController.actions.slide.setLoop( THREE.LoopOnce, 0 );
animationController.actions.jump.clampWhenFinished = true;
animationController.actions.slide.clampWhenFinished = true;

// player motion
playerController.addEventListener( 'startIdling',  () => animationController.play( 'idle'  ) );
playerController.addEventListener( 'startWalking', () => animationController.play( 'run'   ) );
playerController.addEventListener( 'startLanding', () => animationController.play( 'idle'  ) );
playerController.addEventListener( 'endLanding',   () => animationController.play( 'idle'  ) );
playerController.addEventListener( 'startJumping', () => animationController.play( 'jump'  ) );
playerController.addEventListener( 'startSliding', () => animationController.play( 'slide' ) );
playerController.addEventListener( 'startFalling', () => animationController.play( 'slide' ) );
animationController.play( 'slide'  );

// nav mesh and agents
const navMeshResult = threeToSoloNavMesh( [ navGltf.scene.children[ 0 ] ] );
if ( ! navMeshResult.success ) throw new Error( `Failed to build nav mesh: ${ navMeshResult.error }` );
const navMesh = navMeshResult.navMesh;
const navMeshMaterial = new THREE.MeshBasicMaterial( { color: 0x0000ff, wireframe: true } );
const navMeshHelper = new NavMeshHelper( navMesh, { navMeshMaterial } );
scene.add( navMeshHelper );

const maxAgents = 4;
const crowd = new Crowd( navMesh, { maxAgents, maxAgentRadius: .5 } );
const agentMaterial = new THREE.MeshBasicMaterial( { color: 0xff0000 } );
const crowdHelper = new CrowdHelper( crowd, { agentMaterial } );
scene.add( crowdHelper );

for ( let i = 0; i < maxAgents; i ++ ) {

	const initialPositionResult = crowd.navMeshQuery.findRandomPointAroundCircle( { x: 0, y: 0, z: 0 }, 2 );
	if ( ! initialPositionResult.success ) continue;
	crowd.addAgent( initialPositionResult.randomPoint, {
		radius: 0.2,
		height: 1,
		maxAcceleration: 4.0,
		maxSpeed: 4.0,
		collisionQueryRange: 0.5,
		pathOptimizationRange: 0.0,
		separationWeight: 1.0,
	} );

}

const lastTargetPosition = { x: 0, y: 0, z: 0 };

setInterval( () => {

	const targetPosition = {
		x: playerController.position.x,
		y: playerController.position.y,
		z: playerController.position.z };

	if (
		lastTargetPosition.x === targetPosition.x &&
		lastTargetPosition.y === targetPosition.y &&
		lastTargetPosition.z === targetPosition.z
	) return;

	crowd.getAgents().forEach( ( agent ) => {

		const targetResult = crowd.navMeshQuery.findRandomPointAroundCircle( targetPosition, 2 );
		if ( targetResult.success ) agent.requestMoveTarget( targetResult.randomPoint );

	} );

}, 1000 );


( function update () {

	timer.update();
	const delta = timer.getDelta();

	requestAnimationFrame( update );
	world.update( delta );
	// 物理(Body)からメッシュへ transform を同期する
	playerObjectHolder.position.copy( playerController.position );
	playerObjectHolder.quaternion.copy( playerController.quaternion );
	tpsCameraControls.update( delta );
	animationController.update( delta );

	crowd.update( delta );
	crowdHelper.update();

	renderer.render( scene, camera );

} )();

</script>

</body>
</html>
