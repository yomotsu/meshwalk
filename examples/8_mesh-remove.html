<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>=^.^=</title>
<style>
body{margin: 0;padding: 0; background: #000;}
canvas{display: block;}
.info{
	color: #fff;
	position: absolute;
	top: 0;
	left: 0;
}
</style>
</head>
<body>
<div class="info">
	WASD to move, Space to jump<br>
	<button onclick="removeBox();">remove box collision</button>
</div>

<script async src="https://unpkg.com/es-module-shims@2.8.4/dist/es-module-shims.js"></script>
<script type="importmap">
	{
		"imports": {
			"three": "https://unpkg.com/three@0.185.1/build/three.module.js",
			"three/addons/": "https://unpkg.com/three@0.185.1/examples/jsm/",
			"three/examples/": "https://unpkg.com/three@0.185.1/examples/"
		}
	}
</script>
<script type="module">
import * as THREE from 'three';
import * as MW from '../dist/meshwalk.module.js';
// See demo/1_getstarted.html first

const world = new MW.World();
const staticBody1 = new MW.StaticBody();
world.add( staticBody1 );
const staticBody2 = new MW.StaticBody();
world.add( staticBody2 );


const width = window.innerWidth;
const height = window.innerHeight;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera( 40, width / height, 1, 1000 );
camera.position.set( 0, 5, 30 );
const renderer = new THREE.WebGLRenderer();
renderer.setSize( width, height );
document.body.appendChild( renderer.domElement );


const ground = new THREE.Mesh(
	new THREE.PlaneGeometry( 30, 30, 10, 10 ),
	new THREE.MeshBasicMaterial( { color: 0xffffff,  wireframe: true } )
);
ground.rotation.x =  - 90 * THREE.MathUtils.DEG2RAD;
scene.add( ground );
staticBody1.addFromObject( ground );


const wall = new THREE.Mesh(
	new THREE.BoxGeometry( 5, 6, 10 ),
	new THREE.MeshNormalMaterial( { wireframe: true } )
);
wall.position.set( 0, 3, 0 );
// wall.rotation.set( 0, 0, 20 * THREE.MathUtils.DEG2RAD );
scene.add( wall );
staticBody2.addFromObject( wall );

window.removeBox = () => {

	scene.remove( wall );
	world.remove( staticBody2 );

}


const playerRadius = .5;
const playerHeight = 2;
const playerObjectHolder = new THREE.Object3D();
scene.add( playerObjectHolder );

const capsule = new THREE.Mesh(
	new THREE.CapsuleGeometry( playerRadius, playerHeight - playerRadius * 2, 4, 16 ),
	new THREE.MeshBasicMaterial( { color: 0xff0000,  wireframe: true} )
);
capsule.position.y = playerHeight / 2;
playerObjectHolder.add( capsule );

const playerController = new MW.CharacterController( playerRadius, playerHeight );
playerController.teleport( 0, 10, 0 );
world.add( playerController );

// make a keyinput control
const keyInputControl = new MW.KeyboardControls();

// bind events
// キー入力の向きから、望む水平移動速度ベクトルを作って move() に渡す
const _moveDir = new THREE.Vector3();
const applyMove = () => {

	const angle = keyInputControl.frontAngle;
	playerController.move( _moveDir.set( - Math.sin( angle ), 0, - Math.cos( angle ) ).multiplyScalar( 10 ) );

};

keyInputControl.addEventListener( 'movekeyon',     applyMove );
keyInputControl.addEventListener( 'movekeychange', applyMove );
keyInputControl.addEventListener( 'movekeyoff',    () => playerController.move( _moveDir.set( 0, 0, 0 ) ) );
keyInputControl.addEventListener( 'jumpkeypress',  () => playerController.jump() );


( function update () {

	requestAnimationFrame( update );
	world.fixedUpdate();
	// 物理(Body)からメッシュへ transform を同期する
	playerObjectHolder.position.copy( playerController.position );
	playerObjectHolder.quaternion.copy( playerController.quaternion );
	renderer.render( scene, camera );

} )();
</script>

</body>
</html>
